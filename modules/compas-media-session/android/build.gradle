plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.compas.remote.mediasession'
version = '1.0.0'

android {
  namespace "com.compas.remote.mediasession"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "org.jetbrains.kotlin:kotlin-stdlib"
  implementation "androidx.core:core-ktx:1.12.0"
}
